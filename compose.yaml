name: relayai

x-backend-image: &backend-image
  image: relayai-backend:local
  build:
    context: .
    dockerfile: deploy/docker/backend.Dockerfile

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  init:
    <<: *backend-image
    entrypoint: ["/bin/sh", "/app/docker/init-secrets.sh"]
    restart: "no"
    volumes:
      - ./data:/data
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: relayai
      POSTGRES_USER: relayai
      POSTGRES_PASSWORD_FILE: /run/relayai-secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/secrets:/run/relayai-secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayai -d relayai -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  backend:
    <<: *backend-image
    restart: unless-stopped
    environment:
      GATEWAY_BASE_URL: http://gateway:18788
      GATEWAY_PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:${RELAYAI_PORT:-8080}}
    volumes:
      - ./data/secrets:/run/relayai-secrets:ro
      - ./deploy/docker/backend.yaml:/app/etc/backend-api.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://127.0.0.1:8888/api/v1/health | grep -Eq '\"database\"[[:space:]]*:[[:space:]]*\"up\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 20s
    logging: *logging

  gateway:
    image: relayai-gateway:local
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_BIND: 0.0.0.0
      GATEWAY_PORT: "18788"
    volumes:
      - ./data/secrets:/run/relayai-secrets:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:18788/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # The gateway currently handles SIGINT for shutdown.
    stop_signal: SIGINT
    stop_grace_period: 20s
    logging: *logging

  web:
    image: relayai-web:local
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${RELAYAI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
